name: wallet

services:
  app-2:
    build: .
    env_file: .env
    environment:
      HTTP_ADDR: :8082
      JWKS_URL: http://keycloak:8081/realms/wallet-realm/protocol/openid-connect/certs
      DATABASE_URL: postgres://${POSTGRES_USER:-wallet}:${POSTGRES_PASSWORD:-wallet}@postgres:5432/${POSTGRES_DB:-wallet}?sslmode=disable
      AWS_ENDPOINT_URL: http://ministack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_OUTBOX_QUEUE_URL: http://ministack:4566/000000000000/outbox.fifo
      SQS_INBOX_QUEUE_URL: http://ministack:4566/000000000000/wager-transactions.fifo
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      ministack:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped

  app-3:
    build: .
    env_file: .env
    environment:
      HTTP_ADDR: :8083
      JWKS_URL: http://keycloak:8081/realms/wallet-realm/protocol/openid-connect/certs
      DATABASE_URL: postgres://${POSTGRES_USER:-wallet}:${POSTGRES_PASSWORD:-wallet}@postgres:5432/${POSTGRES_DB:-wallet}?sslmode=disable
      AWS_ENDPOINT_URL: http://ministack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_OUTBOX_QUEUE_URL: http://ministack:4566/000000000000/outbox.fifo
      SQS_INBOX_QUEUE_URL: http://ministack:4566/000000000000/wager-transactions.fifo
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      ministack:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped
